name: AI Writing Style Check

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional PR number to review (leave empty to auto-detect from the selected branch)'
        required: false
        type: number

permissions:
  contents: read
  pull-requests: write   # needed to post PR comments

jobs:
  style-check:
    name: AI Style Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run AI style check
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: glm-4-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          # Set to "true" to block merge on D-rated reviews.
          # Leave as "false" for advisory-only mode.
          FAIL_ON_CRITICAL: 'false'
        run: python .github/scripts/ai_style_check.py
