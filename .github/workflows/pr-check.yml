name: PR Build Check

on:
  # No path filter on purpose: this job is a required status check, so it must
  # report on every PR to main. A path-filtered workflow would never run for PRs
  # outside those paths and would leave the merge permanently blocked.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-build:
    name: MkDocs Strict Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate MkDocs Build (Strict)
        run: mkdocs build --strict
