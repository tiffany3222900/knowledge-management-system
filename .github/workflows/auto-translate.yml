name: Auto Translate to Chinese

on:
  push:
    branches: [main]
    paths:
      # React to English docs only. A merged translation PR changes just
      # *.zh.md files; re-running translation there would be a no-op that
      # still emits a workflow_run event and queues a duplicate PDF build.
      - 'docs/**'
      - '!docs/*.zh.md'
      - '!docs/**/*.zh.md'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write  # requeue PR checks parked as action_required

jobs:
  translate:
    name: Incremental Translate (EN -> ZH)
    runs-on: ubuntu-latest
    # Skip runs triggered by our own translation commits to prevent loops
    if: ${{ !contains(github.event.head_commit.message, '[skip translate]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2  # need HEAD~1 for incremental diff

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run incremental translation
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_MODEL: glm-4-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/auto_translate.py
