name: Release PDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build PDF and Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null; then
            echo "Tag ${{ inputs.tag }} already exists, reusing it."
          else
            git tag "${{ inputs.tag }}"
            git push origin "${{ inputs.tag }}"
            echo "Created and pushed tag ${{ inputs.tag }}."
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-print-site-plugin mkdocs-static-i18n playwright pikepdf

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Build site
        run: mkdocs build

      - name: Export PDF (EN)
        run: python export_pdf.py en

      - name: Export PDF (ZH)
        run: python export_pdf.py zh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Printer Maintenance Manual ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            ## Printer Maintenance Manual — ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Automated PDF release generated from the MkDocs documentation site.

            **Live site**: https://tiffany3222900.github.io/knowledge-management-system/

            ### What's in this release
            - English PDF (A4, ~50 pages)
            - Chinese PDF (A4, ~49 pages)
            - All 9 documentation sections compiled in each language
            - Table of contents, page numbers, headers/footers

            ### Files
            - `Printer_Maintenance_Manual_EN.pdf` — English version
            - `Printer_Maintenance_Manual_ZH.pdf` — Chinese version
          files: |
            Printer_Maintenance_Manual_EN.pdf
            Printer_Maintenance_Manual_ZH.pdf
          fail_on_unmatched_files: true
          generate_release_notes: true
