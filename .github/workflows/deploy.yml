name: Deploy Docs and PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'export_pdf.py'
      - '.github/workflows/**'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build MkDocs site once, upload as artifact
  # ---------------------------------------------------------------
  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: mkdocs build

      - name: Upload site artifact
        uses: actions/upload-artifact@v6
        with:
          name: site-build
          path: ./site
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 2: Deploy the built site to GitHub Pages (reuses artifact)
  # ---------------------------------------------------------------
  deploy-site:
    name: Deploy Site to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: site-build
          path: ./site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# -----------------------------------------------------------------
# PDF generation lives in pdf-build.yml.
#
# It no longer runs in parallel with "Auto Translate to Chinese".
# It is triggered by the translation workflow completing
# (workflow_run) and by translations landing on main (docs/*.zh.md),
# and only builds once EN/ZH content is actually in sync. This keeps
# generated PDFs from being produced against stale Chinese content.
# -----------------------------------------------------------------
