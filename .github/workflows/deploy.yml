name: Deploy Docs and PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'export_pdf.py'
      - '.github/workflows/**'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build MkDocs site and deploy to GitHub Pages
  # ---------------------------------------------------------------
  deploy-site:
    name: Deploy Site to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-print-site-plugin mkdocs-static-i18n

      - name: Build site
        run: mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------
  # Job 2: Build PDF and open PR for update
  # ---------------------------------------------------------------
  build-pdf:
    name: Build PDF Manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-print-site-plugin mkdocs-static-i18n playwright

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Build site
        run: mkdocs build

      - name: Export PDF
        run: python export_pdf.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Printer_Maintenance_Manual
          path: Printer_Maintenance_Manual.pdf
          retention-days: 30

      - name: Create PR for PDF update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Printer_Maintenance_Manual.pdf
          if git diff --cached --quiet; then
            echo "No changes to PDF, skipping."
            exit 0
          fi
          BRANCH="auto/pdf-update-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "docs: update generated PDF [skip ci]"
          git push origin "$BRANCH"
          echo "PDF pushed to branch $BRANCH"
          gh pr create \
            --title "[CI] Update Printer Manual PDF" \
            --body "Automated PDF update generated by CI. Please review and merge." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
