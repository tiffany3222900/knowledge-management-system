name: Deploy Docs and PDF

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'export_pdf.py'
      - '.github/workflows/**'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # Job 1: Build MkDocs site once, upload as artifact
  # ---------------------------------------------------------------
  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-print-site-plugin mkdocs-static-i18n

      - name: Build site
        run: mkdocs build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ./site
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 2: Deploy the built site to GitHub Pages (reuses artifact)
  # ---------------------------------------------------------------
  deploy-site:
    name: Deploy Site to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ./site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------
  # Job 3: Build PDFs (EN+ZH) and open PR for update
  # Runs in parallel with site build/deploy.
  # Note: PDFs need per-locale builds (build_only_locale) to get
  # pure-language print pages, so the main site artifact is not reused.
  # ---------------------------------------------------------------
  build-pdf:
    name: Build PDF Manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-print-site-plugin mkdocs-static-i18n playwright pikepdf

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Export PDF (EN)
        run: python export_pdf.py en

      - name: Export PDF (ZH)
        run: python export_pdf.py zh

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Printer_Manuals
          path: |
            Printer_Maintenance_Manual_EN.pdf
            Printer_Maintenance_Manual_ZH.pdf
          retention-days: 30

      - name: Create PR for PDF update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Detect which PDFs actually changed (exit 0 = unchanged, exit 1 = changed)
          EN_CHANGED=false
          ZH_CHANGED=false
          git diff --quiet -- Printer_Maintenance_Manual_EN.pdf || EN_CHANGED=true
          git diff --quiet -- Printer_Maintenance_Manual_ZH.pdf || ZH_CHANGED=true

          if [ "$EN_CHANGED" = false ] && [ "$ZH_CHANGED" = false ]; then
            echo "No changes to PDFs, skipping."
            exit 0
          fi

          # Build dynamic title/body based on which files actually changed
          if [ "$EN_CHANGED" = true ] && [ "$ZH_CHANGED" = true ]; then
            TITLE="[CI] Update Printer Manual PDFs (EN+ZH)"
            CHANGED_FILES="Printer_Maintenance_Manual_EN.pdf, Printer_Maintenance_Manual_ZH.pdf"
            git add Printer_Maintenance_Manual_EN.pdf Printer_Maintenance_Manual_ZH.pdf
          elif [ "$EN_CHANGED" = true ]; then
            TITLE="[CI] Update Printer Manual PDF (EN)"
            CHANGED_FILES="Printer_Maintenance_Manual_EN.pdf"
            git add Printer_Maintenance_Manual_EN.pdf
          else
            TITLE="[CI] Update Printer Manual PDF (ZH)"
            CHANGED_FILES="Printer_Maintenance_Manual_ZH.pdf"
            git add Printer_Maintenance_Manual_ZH.pdf
          fi

          BRANCH="auto/pdf-update-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "docs: update generated PDFs [skip ci]"
          git push origin "$BRANCH"
          echo "PDFs pushed to branch $BRANCH"

          printf -v BODY "Automated PDF update(s) generated by CI.\n\n**Changed files:** %s\n\nPlease review and merge." "$CHANGED_FILES"
          gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
