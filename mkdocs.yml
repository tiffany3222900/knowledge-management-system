site_name: Printer Maintenance Manual
site_description: Enterprise-grade daily maintenance and troubleshooting guide for office printers
site_author: IT Operations Team
site_url: https://tiffany3222900.github.io/knowledge-management-system/

repo_name: tiffany3222900/knowledge-management-system
repo_url: https://github.com/tiffany3222900/knowledge-management-system
edit_uri: edit/main/docs/

theme:
  name: material                  # 核心：Material 主题，不是 GitHub 默认
  language: en
  palette:                        # 明暗双色主题切换
    - scheme: default
      primary: indigo             # 主色调：靛蓝色
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate               # 暗色模式
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs             # 顶部导航标签
    - navigation.tabs.sticky      # 导航栏滚动时固定
    - navigation.sections         # 左侧分组
    - navigation.expand           # 默认展开目录
    - navigation.path             # 面包屑路径
    - navigation.indexes
    - navigation.top
    - search.suggest              # 搜索建议
    - search.highlight            # 搜索高亮
    - search.share
    - content.code.copy           # 代码复制按钮
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow                  # 目录跟随滚动
    - toc.integrate               # 目录集成到侧边栏
  icon:
    repo: fontawesome/brands/github
    logo: material/printer-wireless  # 网站图标（打印机）

plugins:
  - search
  - tags
  - print-site:
      add_to_navigation: true
      print_page_title: 'Printer Maintenance Manual'
      add_table_of_contents: true
      enumerate_headings: true
      enumerate_figures: true
      add_full_urls: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Daily Checklist: daily-checklist.md
  - Cleaning & Care: cleaning.md
  - Consumables: consumables.md
  - Paper Handling: paper-handling.md
  - Troubleshooting: troubleshooting.md
  - Safety: safety.md
  - FAQ: faq.md
  - Download PDF: https://github.com/tiffany3222900/knowledge-management-system/raw/main/Printer_Maintenance_Manual.pdf

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tiffany3222900
  generator: false

