# Vale configuration
# Docs: https://vale.sh/docs/topics/config/
#
# Advisory-only: MinAlertLevel = suggestion, and the workflow runs with
# fail_on_error=false, so Vale findings are posted as PR annotations
# and never block the merge.

StylesPath = styles
MinAlertLevel = suggestion

# Fetch the Microsoft style guide ruleset automatically (vale sync).
Packages = Microsoft

# Apply Microsoft rules to English Markdown.
[*.md]
BasedOnStyles = Microsoft

# Chinese documents are human-reviewed; disable all Vale checks on them.
[*.zh.md]
BasedOnStyles =
